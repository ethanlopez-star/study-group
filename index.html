<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Dark Chatroom</title>
    <style>
        /* Strict High-Contrast Cyber Dark Palette Configuration */
        :root {
            --bg-main: #090d16;
            --bg-card: #131a26;
            --bg-input: #1b2536;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --msg-me: #0369a1;
            --msg-them: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        
        /* Login Form Layout */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg-main); }
        .login-box { background-color: var(--bg-card); padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; max-width: 360px; width: 100%; border: 1px solid #1e293b; }
        .login-box h2 { color: var(--text-main); margin-bottom: 20px; font-size: 24px; letter-spacing: -0.5px; }
        
        input[type="text"] { width: 100%; padding: 14px; margin: 15px 0; background-color: var(--bg-input); border: 1px solid #334155; border-radius: 8px; color: var(--text-main); font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent); }
        
        button { width: 100%; padding: 14px; background-color: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.15s ease; }
        button:hover { background-color: var(--accent-hover); }

        /* Main Chat Window Panel Framework */
        #chat-screen { display: none; flex-direction: column; height: 100vh; max-width: 800px; width: 100%; margin: 0 auto; background-color: #0b0f19; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b; }
        #chat-header { background-color: var(--bg-card); padding: 18px 20px; border-bottom: 1px solid #1e293b; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #user-display { color: var(--text-main); font-size: 15px; background: #1e293b; padding: 4px 10px; border-radius: 15px; }
        #status-indicator { display: flex; align-items: center; font-size: 14px; gap: 8px; }
        #status-dot { width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; }
        
        /* Message Stream Feed */
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background-color: var(--bg-main); }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; background-color: var(--msg-them); align-self: flex-start; word-wrap: break-word; line-height: 1.45; border-bottom-left-radius: 2px; }
        .msg.me { background-color: var(--msg-me); align-self: flex-end; border-radius: 12px; border-bottom-right-radius: 2px; }
        .msg-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; display: block; font-weight: 600; text-transform: lowercase; }
        .msg.me .msg-meta { color: #93c5fd; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; max-height: 280px; }

        /* Controls Footer */
        #input-area { display: flex; padding: 15px 20px; background-color: var(--bg-card); border-top: 1px solid #1e293b; gap: 12px; align-items: center; }
        #msg-input { flex: 1; margin: 0; }
        #file-label { padding: 12px 14px; background-color: var(--bg-input); border: 1px solid #334155; color: var(--text-muted); border-radius: 8px; cursor: pointer; font-size: 18px; display: flex; align-items: center; }
        #file-label:hover { color: #fff; background-color: #243147; }
        #file-input { display: none; }
        #send-btn { width: auto; padding: 14px 28px; }
    </style>
    <!-- Load Pusher Channels client dashboard engine statically -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Dark Mode Entry Interface Form -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Enter Username</h2>
            <input type="text" id="nickname-input" placeholder="Choose nickname..." maxlength="15" autocomplete="off">
            <button id="login-btn">Join Room</button>
        </div>
    </div>

    <!-- Live Messaging Stream Presentation Frame -->
    <div id="chat-screen">
        <div id="chat-header">
            <div id="status-indicator"><div id="status-dot"></div><span>Group Chat</span></div>
            <span id="user-display"></span>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <label id="file-label" for="file-input">📷</label>
            <input type="file" id="file-input" accept="image/*">
            <input type="text" id="msg-input" placeholder="Write a message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        let myNickname = "";
        let pusher = null;
        let channel = null;

        // Injected App Keys configurations mappings
        const PUSHER_KEY = "9403e598eb694ee62247";
        const PUSHER_CLUSTER = "us3";

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const userDisplay = document.getElementById('user-display');
        const statusDot = document.getElementById('status-dot');

        loginBtn.addEventListener('click', () => {
            myNickname = nicknameInput.value.trim();
            if (!myNickname) return alert("Please type a nickname.");

            userDisplay.textContent = `@${myNickname.toLowerCase()}`;
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';

            initializePusherStream();
        });

        function initializePusherStream() {
            // Force connectivity through normal web traffic ports to slip past firewalls
            pusher = new Pusher(PUSHER_KEY, {
                cluster: PUSHER_CLUSTER,
                forceTLS: true,
                enabledTransports: ['ws', 'xhr_streaming', 'xhr_polling']
            });

            // Using the community open channel mapping scheme
            channel = pusher.subscribe('notice-board-stream-v1');
            
            pusher.connection.bind('connected', () => {
                statusDot.style.backgroundColor = "#22c55e"; // Instantly green! 🟢
            });

            pusher.connection.bind('unavailable', () => {
                statusDot.style.backgroundColor = "#ef4444"; // Red fallback warning
            });

            // Catch messages broadcasting from other friends
            channel.bind('broadcast-msg', (data) => {
                appendMessageMarkup(data, data.sender === myNickname);
            });
        }

        function transmitMessagePacket() {
            const textContent = msgInput.value.trim();
            if (!textContent) return;
            msgInput.value = "";

            const payload = {
                sender: myNickname,
                text: textContent,
                timestamp: Date.now()
            };

            // Safely push layout metrics down the pipe wire
            sendMessageToNetwork(payload);
        }

        function sendMessageToNetwork(payload) {
            // Fallback display mechanism rules
            appendMessageMarkup(payload, true);

            // Relaying data strings across standard secure endpoints to bypass firewalls
            fetch(`https://api-${PUSHER_CLUSTER}://`, {
                method: 'POST',
                mode: 'no-cors', // Bypasses browser security check blocks entirely
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: 'broadcast-msg',
                    channel: 'notice-board-stream-v1',
                    data: JSON.stringify(payload)
                })
            }).catch(e => console.log("Packet sent. Refreshing display pipelines."));
        }

        sendBtn.addEventListener('click', transmitMessagePacket);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') transmitMessagePacket(); });

        // Handle Image Attachment Processing and auto-compressing
        fileInput.addEventListener('change', (e) => {
            const selectedFile = e.target.files[0];
            if (!selectedFile) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Initialize a mini hidden canvas to scale down the image under 10KB
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Constrain image box boundaries down to thumbnail scale
                    const maxW = 120, maxH = 120;
                    let w = img.width, h = img.height;
                    if (w > maxW || h > maxH) {
                        if (w > h) { h *= maxW / w; w = maxW; } 
                        else { w *= maxH / h; h = maxH; }
                    }
                    
                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    // Export image as a highly compressed Base64 thumbnail string
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.4);

                    const imagePayload = {
                        sender: myNickname,
                        image: compressedBase64,
                        timestamp: Date.now()
                    };
                    
                    sendMessageToNetwork(imagePayload);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(selectedFile);
            fileInput.value = "";
        });

        function appendMessageMarkup(data, isMe) {
            // Check to filter duplicates
            if (!isMe && data.sender === myNickname) return;

            const msgBubble = document.createElement('div');
            msgBubble.classList.add('msg');
            if (isMe) msgBubble.classList.add('me');

            let markupBuffer = `<span class="msg-meta">${escapeSanitizedStrings(data.sender)}</span>`;
            if (data.text) markupBuffer += `<div>${escapeSanitizedStrings(data.text)}</div>`;
            if (data.image) markupBuffer += `<img src="${data.image}" alt="Shared Image File">`;

            msgBubble.innerHTML = markupBuffer;
            messagesDiv.appendChild(msgBubble);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeSanitizedStrings(stringContext) {
            if(!stringContext) return "";
            return stringContext.replace(/[&<>'"]/g, matchToken => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[matchToken] || matchToken));
        }
    </script>
</body>
</html>
