<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Dark P2P Chat</title>
    <style>
        /* Sleek Cyber Dark UI Theme Styling */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #0f141c; color: #e3e6eb; }
        
        /* Setup Container */
        #setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; background: #0b0f17; }
        .box { background: #171f2e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-align: center; max-width: 400px; width: 100%; margin-bottom: 20px; border: 1px solid #243147; }
        h2 { font-size: 20px; margin-bottom: 5px; color: #0084ff; font-weight: 600; }
        input, button { padding: 12px; margin: 12px 0; width: 100%; border: 1px solid #2a3b54; border-radius: 6px; font-size: 16px; background: #1d293b; color: #fff; outline: none; transition: 0.2s; }
        input:focus { border-color: #0084ff; box-shadow: 0 0 0 2px rgba(0,132,255,0.2); }
        button { background: #0084ff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0066cc; }
        .host-btn { background: #00b16a; }
        .host-btn:hover { background: #009659; }
        
        /* Chat Interface Layout */
        #chat-screen { display: none; flex-direction: column; height: 100vh; max-width: 900px; width: 100%; margin: 0 auto; background: #121824; border-left: 1px solid #1f2a3c; border-right: 1px solid #1f2a3c; }
        #chat-header { background: #17202e; border-bottom: 1px solid #233045; padding: 15px 20px; font-size: 16px; font-weight: bold; display: flex; flex-direction: column; gap: 6px; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #0e131f; }
        
        /* Dark Theme Message Elements */
        .msg { max-width: 75%; padding: 11px 15px; border-radius: 10px; background: #222d3f; align-self: flex-start; line-height: 1.4; word-wrap: break-word; border: 1px solid #2c3a50; }
        .msg.me { background: #0084ff; color: white; align-self: flex-end; border: none; }
        .msg-meta { font-size: 11px; color: #8ba2c0; margin-bottom: 5px; display: block; font-weight: bold; }
        .msg.me .msg-meta { color: #b3d7ff; }
        .msg img { max-width: 100%; border-radius: 6px; margin-top: 8px; display: block; max-height: 320px; border: 1px solid rgba(255,255,255,0.1); }

        /* System Messages */
        .system-msg { align-self: center; background: #2a2115; color: #ffd075; border: 1px solid #4a3b20; font-size: 13px; padding: 6px 14px; border-radius: 20px; text-align: center; }

        /* Input Controls Footer */
        #input-area { display: flex; padding: 15px 20px; border-top: 1px solid #233045; background: #17202e; gap: 12px; align-items: center; }
        #msg-input { flex: 1; margin: 0; }
        #file-label { padding: 12px 14px; background: #2c3a50; color: #a0aec0; border-radius: 6px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.2s; border: 1px solid #374963; }
        #file-label:hover { background: #374963; color: #fff; }
        #file-input { display: none; }
        #send-btn { width: auto; margin: 0; padding: 12px 24px; }
    </style>

    <!-- FIXED: Using jsDelivr distribution CDN which prevents loading script blocks -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen">
        <div class="box">
            <h2>1. Profile Nickname</h2>
            <input type="text" id="nickname-input" placeholder="Enter display name..." maxlength="15">
        </div>

        <div class="box">
            <h2>2. Session Engine</h2>
            <button id="host-btn" class="host-btn">Create New Room</button>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #243147;">
            <input type="text" id="room-input" placeholder="Paste entry Room Code...">
            <button id="join-btn">Join Friend's Room</button>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-screen">
        <div id="chat-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="user-display" style="color: #0084ff;">User: Loading...</span>
                <span id="peer-count" style="font-size: 13px; color: #a0aec0; background: #222d3f; padding: 3px 8px; border-radius: 12px;">Connections: 0</span>
            </div>
            <div id="room-id-display" style="font-size: 12px; background: #1d293b; border: 1px dashed #3b4f6b; padding: 8px; border-radius: 6px; margin-top: 4px; cursor: pointer; text-align: center; color: #cbd5e1;"></div>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <label id="file-label" for="file-input">📷</label>
            <input type="file" id="file-input" accept="image/*">
            <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        let peer = null;
        let connections = [];
        let myNickname = "";
        let takenNames = new Set();
        let isHost = false;

        const setupScreen = document.getElementById('setup-screen');
        const chatScreen = document.getElementById('chat-screen');
        const nicknameInput = document.getElementById('nickname-input');
        const hostBtn = document.getElementById('host-btn');
        const roomInput = document.getElementById('room-input');
        const joinBtn = document.getElementById('join-btn');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const userDisplay = document.getElementById('user-display');
        const roomIdDisplay = document.getElementById('room-id-display');
        const peerCount = document.getElementById('peer-count');

        // Click Handler for Creating a New Room
        hostBtn.addEventListener('click', () => {
            if (!validateInputForm()) return;
            isHost = true;
            takenNames.add(myNickname.toLowerCase());
            
            // Explicitly generate configuration parameters using random strings
            const roomCodeId = 'room-' + Math.random().toString(36).substring(2, 9);
            initializeP2PNetwork(roomCodeId);
        });

        // Click Handler for Joining a Room
        joinBtn.addEventListener('click', () => {
            if (!validateInputForm()) return;
            const enteredCode = roomInput.value.trim();
            if (!enteredCode) return alert("Please paste your friend's Room Code.");
            
            isHost = false;
            initializeP2PNetwork(null, enteredCode);
        });

        function validateInputForm() {
            myNickname = nicknameInput.value.trim();
            if (!myNickname) {
                alert("Please pick a nickname first.");
                return false;
            }
            return true;
        }

        // Core Network Communication Engine
        function initializeP2PNetwork(assignedId, remoteId = null) {
            try {
                // Instantiating PeerJS using an explicit public fallback array configuration
                peer = new Peer(assignedId, {
                    debug: 1
                });

                // Error listener catch block to immediately handle locked signaling sockets
                peer.on('error', (err) => {
                    console.error("Network initialization fault:", err);
                    alert("Network Connection Error: " + err.type + ". Try refreshing or switching connections.");
                });

                peer.on('open', (confirmedId) => {
                    setupScreen.style.display = 'none';
                    chatScreen.style.display = 'flex';
                    userDisplay.textContent = `Active User: ${myNickname}`;
                    
                    if (isHost) {
                        roomIdDisplay.innerHTML = `📋 <b>Click to Copy Code:</b> <span style="color:#00b16a">${confirmedId}</span>`;
                        roomIdDisplay.onclick = () => {
                            navigator.clipboard.writeText(confirmedId);
                            alert("Room Code copied to clipboard! Send it to friends.");
                        };
                        addSystemAlert("Room generated. Share your Room Code string with friends.");
                    } else {
                        roomIdDisplay.textContent = `Connected to Room: ${remoteId}`;
                        const directChannel = peer.connect(remoteId, { metadata: { nickname: myNickname } });
                        configureStreamEvents(directChannel);
                    }
                });

                // Host structural handler logic to absorb data tunnels
                peer.on('connection', (incomingTunnel) => {
                    if (!isHost) return;
                    const connectionProfileName = incomingTunnel.metadata.nickname;
                    
                    if (takenNames.has(connectionProfileName.toLowerCase())) {
                        setTimeout(() => {
                            incomingTunnel.send({ type: 'denied', info: 'Username signature already exists inside this workspace.' });
                            incomingTunnel.close();
                        }, 400);
                        return;
                    }

                    takenNames.add(connectionProfileName.toLowerCase());
                    configureStreamEvents(incomingTunnel);
                    
                    setTimeout(() => {
                        pushPayload({ type: 'system', text: `${connectionProfileName} joined the group chat.` });
                        synchronizeNetworkUsers();
                    }, 400);
                });

            } catch (fatalError) {
                alert("Browser runtime error while building client architecture: " + fatalError.message);
            }
        }

        function configureStreamEvents(channel) {
            connections.push(channel);
            updateStatusCounters();

            channel.on('data', (packet) => {
                if (packet.type === 'denied') {
                    alert(packet.info);
                    window.location.reload();
                }
                if (packet.type === 'chat' || packet.type === 'system') {
                    renderMessageBubble(packet);
                    if (isHost) pushPayload(packet, channel); // Distribute packet down the hierarchy line
                }
                if (packet.type === 'manifest' && !isHost) {
                    takenNames = new Set(packet.list);
                }
            });

            channel.on('close', () => {
                connections = connections.filter(current => current !== channel);
                updateStatusCounters();
                const lostSignature = channel.metadata?.nickname || "A companion";
                if (isHost) {
                    takenNames.delete(lostSignature.toLowerCase());
                    pushPayload({ type: 'system', text: `${lostSignature} dropped out.` });
                    synchronizeNetworkUsers();
                }
            });
        }

        function updateStatusCounters() {
            peerCount.textContent = `Connections: ${connections.length}`;
        }

        function synchronizeNetworkUsers() {
            if (!isHost) return;
            pushPayload({ type: 'manifest', list: Array.from(takenNames) });
        }

        function pushPayload(payload, structuralSkipChannel = null) {
            connections.forEach(channel => {
                if (channel !== structuralSkipChannel && channel.open) {
                    channel.send(payload);
                }
            });
        }

        // Message Dispatch Mechanics
        function executeTextDelivery() {
            const rawText = msgInput.value.trim();
            if (!rawText) return;
            msgInput.value = "";

            const payloadObject = { type: 'chat', sender: myNickname, text: rawText };
            renderMessageBubble(payloadObject, true);

            if (isHost) pushPayload(payloadObject);
            else connections.forEach(channel => { if(channel.open) channel.send(payloadObject); });
        }

        sendBtn.addEventListener('click', executeTextDelivery);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') executeTextDelivery(); });

        // Media Input Stream Operations
        fileInput.addEventListener('change', (e) => {
            const uploadedFile = e.target.files[0];
            if (!uploadedFile) return;

            const fileReaderInstance = new FileReader();
            fileReaderInstance.onload = function(readerEvent) {
                const structuralPayloadImage = {
                    type: 'chat',
                    sender: myNickname,
                    image: readerEvent.target.result
                };
                renderMessageBubble(structuralPayloadImage, true);
                if (isHost) pushPayload(structuralPayloadImage);
                else connections.forEach(channel => { if(channel.open) channel.send(structuralPayloadImage); });
            };
            fileReaderInstance.readAsDataURL(uploadedFile);
            fileInput.value = "";
        });

        // Interface Engine UI Drawer Pipeline
        function renderMessageBubble(packet, localAuthorFlag = false) {
            if (packet.type === 'system') {
                const systemElement = document.createElement('div');
                systemElement.classList.add('system-msg');
                systemElement.innerHTML = `<span>${sanitizeHTML(packet.text)}</span>`;
                messagesDiv.appendChild(systemElement);
            } else {
                const chatBubbleElement = document.createElement('div');
                chatBubbleElement.classList.add('msg');
                
                if (localAuthorFlag || packet.sender === myNickname) {
                    chatBubbleElement.classList.add('me');
                }

                let generatedStringMarkup = `<span class="msg-meta">${sanitizeHTML(packet.sender)}</span>`;
                if (packet.text) generatedStringMarkup += `<div>${sanitizeHTML(packet.text)}</div>`;
                if (packet.image) generatedStringMarkup += `<img src="${packet.image}" alt="Shared Image Layout">`;
                
                chatBubbleElement.innerHTML = generatedStringMarkup;
                messagesDiv.appendChild(chatBubbleElement);
            }
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addSystemAlert(messageStringText) {
            renderMessageBubble({ type: 'system', text: messageStringText });
        }

        function sanitizeHTML(rawStringData) {
            return rawStringData.replace(/[&<>'"]/g, matchToken => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[matchToken] || matchToken));
        }
    </script>
</body>
</html>
