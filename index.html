<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Chat Room</title>
    <style>
        /* Force Dark Theme Variables */
        :root {
            --bg-main: #0b0f19;
            --bg-card: #161f30;
            --bg-input: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --msg-me: #0284c7;
            --msg-them: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        
        /* Entrance Login Screen */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg-main); }
        .login-box { background-color: var(--bg-card); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 360px; width: 100%; border: 1px solid #243147; }
        .login-box h2 { color: var(--accent); margin-bottom: 20px; font-size: 24px; }
        
        /* Inputs and Interactive Elements */
        input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; background-color: var(--bg-input); border: 1px solid #334155; border-radius: 6px; color: var(--text-main); font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent); }
        
        button { width: 100%; padding: 12px; background-color: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: var(--accent-hover); }

        /* Main Chat Screen Layout */
        #chat-screen { display: none; flex-direction: column; height: 100vh; max-width: 800px; width: 100%; margin: 0 auto; background-color: #111827; border-left: 1px solid #1f2937; border-right: 1px solid #1f2937; }
        #chat-header { background-color: var(--bg-card); padding: 15px 20px; border-bottom: 1px solid #1f2937; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #user-display { color: var(--accent); }
        
        /* Message Area */
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-color: var(--bg-main); }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 8px; background-color: var(--msg-them); align-self: flex-start; word-wrap: break-word; line-height: 1.4; }
        .msg.me { background-color: var(--msg-me); align-self: flex-end; }
        .msg-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: block; font-weight: 600; }
        .msg.me .msg-meta { color: #bae6fd; }
        .msg img { max-width: 100%; border-radius: 6px; margin-top: 8px; display: block; max-height: 300px; }

        /* Chat Controls Footer */
        #input-area { display: flex; padding: 15px; background-color: var(--bg-card); border-top: 1px solid #1f2937; gap: 10px; align-items: center; }
        #msg-input { flex: 1; margin: 0; }
        #file-label { padding: 10px 14px; background-color: var(--bg-input); border: 1px solid #334155; color: var(--text-muted); border-radius: 6px; cursor: pointer; font-size: 18px; }
        #file-label:hover { color: #fff; background-color: #334155; }
        #file-input { display: none; }
        #send-btn { width: auto; padding: 12px 24px; }
    </style>
</head>
<body>

    <!-- 100% Dark Mode Login Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Enter Chatroom</h2>
            <input type="text" id="nickname-input" placeholder="Choose a nickname..." maxlength="15">
            <button id="login-btn">Join Chat</button>
        </div>
    </div>

    <!-- Main Chat Screen Layout -->
    <div id="chat-screen">
        <div id="chat-header">
            <span>Group Feed</span>
            <span id="user-display"></span>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <label id="file-label" for="file-input">📷</label>
            <input type="file" id="file-input" accept="image/*">
            <input type="text" id="msg-input" placeholder="Write a message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        // Local state management without external data script tracking dependencies
        let myNickname = "";
        const localChatHistoryKey = "local_group_chat_history";
        const localActiveUsersKey = "local_group_active_users";

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const userDisplay = document.getElementById('user-display');

        // Instant local action login configuration
        loginBtn.addEventListener('click', () => {
            const enteredName = nicknameInput.value.trim();
            if (!enteredName) return alert("Please type a nickname.");

            // Verify nickname availability inside the active cache index
            let currentUsers = JSON.parse(localStorage.getItem(localActiveUsersKey) || "[]");
            if (currentUsers.map(u => u.toLowerCase()).includes(enteredName.toLowerCase())) {
                alert("That nickname is taken! Choose another.");
                return;
            }

            // Save name to tracking list
            currentUsers.push(enteredName);
            localStorage.setItem(localActiveUsersKey, JSON.stringify(currentUsers));

            myNickname = enteredName;
            userDisplay.textContent = `As: ${myNickname}`;
            
            // Swap display blocks instantly
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';

            // Begin feed loops
            startLocalFeed();
        });

        function startLocalFeed() {
            // Render any messages already stored
            renderMessages();

            // Check for new messages from friends every single second
            setInterval(renderMessages, 1000);
        }

        function renderMessages() {
            const rawData = localStorage.getItem(localChatHistoryKey) || "[]";
            const messages = JSON.parse(rawData);
            
            // Safely verify if rendering container matches document node elements
            const currentCount = messagesDiv.children.length;
            if (currentCount === messages.length) return; 

            messagesDiv.innerHTML = "";
            messages.forEach((data) => {
                const isMe = data.sender === myNickname;
                const msgBubble = document.createElement('div');
                msgBubble.classList.add('msg');
                if (isMe) msgBubble.classList.add('me');

                let content = `<span class="msg-meta">${escapeHTML(data.sender)}</span>`;
                if (data.text) content += `<div>${escapeHTML(data.text)}</div>`;
                if (data.image) content += `<img src="${data.image}" alt="Attached File Image">`;

                msgBubble.innerHTML = content;
                messagesDiv.appendChild(msgBubble);
            });
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Deliver text data message strings
        function pushTextMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            msgInput.value = "";

            const messages = JSON.parse(localStorage.getItem(localChatHistoryKey) || "[]");
            messages.push({
                sender: myNickname,
                text: text,
                timestamp: Date.now()
            });

            localStorage.setItem(localChatHistoryKey, JSON.stringify(messages));
            renderMessages();
        }

        sendBtn.addEventListener('click', pushTextMessage);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') pushTextMessage(); });

        // Process image uploads locally as base64 string vectors
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const messages = JSON.parse(localStorage.getItem(localChatHistoryKey) || "[]");
                messages.push({
                    sender: myNickname,
                    image: event.target.result,
                    timestamp: Date.now()
                });
                localStorage.setItem(localChatHistoryKey, JSON.stringify(messages));
                renderMessages();
            };
            reader.readAsDataURL(file);
            fileInput.value = "";
        });

        // HTML Sanitization logic block
        function escapeHTML(str) {
            if(!str) return "";
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // Clean name profile footprints if tab is destroyed
        window.addEventListener('beforeunload', () => {
            if (myNickname) {
                let currentUsers = JSON.parse(localStorage.getItem(localActiveUsersKey) || "[]");
                currentUsers = currentUsers.filter(u => u !== myNickname);
                localStorage.setItem(localActiveUsersKey, JSON.stringify(currentUsers));
            }
        });
    </script>
</body>
</html>
