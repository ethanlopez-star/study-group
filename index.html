<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Web Chatroom</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #161f30;
            --bg-input: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --msg-me: #0284c7;
            --msg-them: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        
        /* Login Screen */
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg-main); }
        .login-box { background-color: var(--bg-card); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 360px; width: 100%; border: 1px solid #243147; }
        .login-box h2 { color: var(--accent); margin-bottom: 20px; font-size: 24px; }
        
        input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; background-color: var(--bg-input); border: 1px solid #334155; border-radius: 6px; color: var(--text-main); font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent); }
        
        button { width: 100%; padding: 12px; background-color: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: var(--accent-hover); }

        /* Main Chat Screen Layout */
        #chat-screen { display: none; flex-direction: column; height: 100vh; max-width: 800px; width: 100%; margin: 0 auto; background-color: #111827; border-left: 1px solid #1f2937; border-right: 1px solid #1f2937; }
        #chat-header { background-color: var(--bg-card); padding: 15px 20px; border-bottom: 1px solid #1f2937; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #user-display { color: var(--accent); }
        #status-dot { width: 10px; height: 10px; background-color: #ef4444; border-radius: 50%; display: inline-block; margin-left: 8px; }
        
        /* Message Area */
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background-color: var(--bg-main); }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 8px; background-color: var(--msg-them); align-self: flex-start; word-wrap: break-word; line-height: 1.4; }
        .msg.me { background-color: var(--msg-me); align-self: flex-end; }
        .msg-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; display: block; font-weight: 600; }
        .msg.me .msg-meta { color: #bae6fd; }
        .msg img { max-width: 100%; border-radius: 6px; margin-top: 8px; display: block; max-height: 300px; }

        /* Chat Controls Footer */
        #input-area { display: flex; padding: 15px; background-color: var(--bg-card); border-top: 1px solid #1f2937; gap: 10px; align-items: center; }
        #msg-input { flex: 1; margin: 0; }
        #file-label { padding: 10px 14px; background-color: var(--bg-input); border: 1px solid #334155; color: var(--text-muted); border-radius: 6px; cursor: pointer; font-size: 18px; }
        #file-label:hover { color: #fff; background-color: #334155; }
        #file-input { display: none; }
        #send-btn { width: auto; padding: 12px 24px; }
    </style>
</head>
<body>

    <!-- Dark Mode Entrance Screen -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Enter Chatroom</h2>
            <input type="text" id="nickname-input" placeholder="Choose a nickname..." maxlength="15">
            <button id="login-btn">Join Chat</button>
        </div>
    </div>

    <!-- Main Chat Screen Layout -->
    <div id="chat-screen">
        <div id="chat-header">
            <span>Group Feed <span id="status-dot"></span></span>
            <span id="user-display"></span>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <label id="file-label" for="file-input">📷</label>
            <input type="file" id="file-input" accept="image/*">
            <input type="text" id="msg-input" placeholder="Write a message..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        let socket = null;
        let myNickname = "";
        
        // Using an open public testing echo WebSocket server that accepts broadcast strings
        const wsServerUrl = "wss://echo.websocket.org"; 

        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const nicknameInput = document.getElementById('nickname-input');
        const loginBtn = document.getElementById('login-btn');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const userDisplay = document.getElementById('user-display');
        const statusDot = document.getElementById('status-dot');

        // Handle joining room instantly
        loginBtn.addEventListener('click', () => {
            myNickname = nicknameInput.value.trim();
            if (!myNickname) return alert("Please type a nickname.");

            userDisplay.textContent = `As: ${myNickname}`;
            loginScreen.style.display = 'none';
            chatScreen.style.display = 'flex';

            connectToChatStream();
        });

        function connectToChatStream() {
            // Native browser WebSockets bypass external JS load dependencies completely
            socket = new WebSocket(wsServerUrl);

            socket.onopen = () => {
                statusDot.style.backgroundColor = "#22c55e"; // Green for connected
                addSystemMessage("Connected to real-time chat pipeline.");
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // Filter messages to make sure they are meant for this channel
                    if (data.channel === "github-group-study-chat-v3") {
                        appendMessageBubble(data, false);
                    }
                } catch(e) {
                    // Ignore non-JSON echo test loops from raw socket servers
                }
            };

            socket.onclose = () => {
                statusDot.style.backgroundColor = "#ef4444"; // Red for disconnected
                // Automatically attempt to reconnect if dropped
                setTimeout(connectToChatStream, 3000);
            };
        }

        function sendDataPayload(payload) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(payload));
            }
        }

        // Deliver text messages
        function dispatchTextMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            msgInput.value = "";

            const messageData = {
                channel: "github-group-study-chat-v3",
                sender: myNickname,
                text: text,
                timestamp: Date.now()
            };

            // Display locally for yourself instantly
            appendMessageBubble(messageData, true);
            // Broadcast it over the web socket to your friends
            sendDataPayload(messageData);
        }

        sendBtn.addEventListener('click', dispatchTextMessage);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') dispatchTextMessage(); });

        // Handle image attachment streams
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 500 * 1024) { // Keep images under 500KB over real-time streams
                alert("Image is too large! Please choose an image under 500KB.");
                fileInput.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const messageData = {
                    channel: "github-group-study-chat-v3",
                    sender: myNickname,
                    image: event.target.result,
                    timestamp: Date.now()
                };
                appendMessageBubble(messageData, true);
                sendDataPayload(messageData);
            };
            reader.readAsDataURL(file);
            fileInput.value = "";
        });

        // UI View Constructor
        function appendMessageBubble(data, isMe) {
            // Check if bubble already printed to screen (prevents echo duplicates)
            if (!isMe && data.sender === myNickname) return;

            const msgBubble = document.createElement('div');
            msgBubble.classList.add('msg');
            if (isMe) msgBubble.classList.add('me');

            let content = `<span class="msg-meta">${escapeHTML(data.sender)}</span>`;
            if (data.text) content += `<div>${escapeHTML(data.text)}</div>`;
            if (data.image) content += `<img src="${data.image}" alt="Shared Graphic Link">`;

            msgBubble.innerHTML = content;
            messagesDiv.appendChild(msgBubble);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addSystemMessage(text) {
            const sysBubble = document.createElement('div');
            sysBubble.style.alignSelf = "center";
            sysBubble.style.fontSize = "12px";
            sysBubble.style.color = "var(--text-muted)";
            sysBubble.style.padding = "5px";
            sysBubble.textContent = text;
            messagesDiv.appendChild(sysBubble);
        }

        function escapeHTML(str) {
            if(!str) return "";
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
